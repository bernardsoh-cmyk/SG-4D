# Publishes the results feed the app reads.
#
# 4D draws Wednesday, Saturday and Sunday at 6.30pm SGT (10:30 UTC), and the
# results appear on Singapore Pools' site within the hour. First run is about
# an hour after that, with a second as a safety net.
#
# On the minutes, which are deliberate and not arbitrary: these were originally
# '0 12' and '0 15', and every run landed roughly FOUR HOURS late — 15:55 and
# 18:09 UTC on 20 Sep, 16:42 and 18:56 on 23 Sep. GitHub's scheduler is
# best-effort, and the top of the hour is when everyone else's cron is queued,
# so a job at :00 waits behind the crowd. Off-peak minutes get picked up sooner.
# Keep them odd-looking; do not "tidy" them back to :00.
#
# Even so, a late run is normal rather than broken. The app copes with a feed
# that is behind: it labels the result as possibly not the latest, and inside
# the APK the native fallback reads Singapore Pools directly.
#
# --limit 5 keeps each run to the draws actually missing. It walks the index
# newest-first, so new draws are always taken first and any leftover budget
# quietly backfills older history until it reaches the 2023 end of the index.
# A cold start wants `python tools/scrape.py --backfill 250` run once, locally,
# with the result committed.

name: Scrape 4D results

on:
  schedule:
    - cron: '37 11 * * 0,3,6'   # 19:37 SGT — about an hour after the draw
    - cron: '43 14 * * 0,3,6'   # 22:43 SGT — safety net
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # No pip install: tools/scrape.py is stdlib-only precisely so this step
      # cannot break on a dependency.
      - name: Fetch new draws
        run: python tools/scrape.py --limit 5 --out data/history.json

      - name: Sanity-check the output
        run: |
          python - <<'PY'
          import json
          d = json.load(open('data/history.json', encoding='utf-8'))
          draws = d['fourd']
          # A parser that has silently stopped working writes a valid but empty
          # file. Fail the run rather than publishing one.
          assert len(draws) > 100, 'too few draws: %d' % len(draws)
          for x in draws[:5]:
              assert x['first'] and len(x['first']) == 4, 'draw %s missing 1st prize' % x['draw']
              assert len(x['starter']) == 10, 'draw %s has %d starters' % (x['draw'], len(x['starter']))
              assert len(x['consolation']) == 10, 'draw %s has %d consolations' % (x['draw'], len(x['consolation']))
          print('ok: %d draws, newest %s' % (len(draws), draws[0]['date']))
          PY

      - name: Commit if anything changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/history.json
          git diff --staged --quiet || git commit -m "Results up to $(date -u +%Y-%m-%d)"
          git push
